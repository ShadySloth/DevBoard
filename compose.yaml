services:
  project_service:
    image: devboard-project
    build:
      context: .
      dockerfile: Backend/src/Services/Project/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8081
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WriteDatabase: Host=project_db;Database=project;Username=devboard;Password=devboard
      ConnectionStrings__ReadDatabase: Host=project_read_db;Database=project;Username=devboard;Password=devboard
    ports:
      - "8081:8081"
    depends_on:
      project_write_db:
        condition: service_started
      project_read_db:
        condition: service_started

  project_write_db:
    image: postgres:18
    environment:
      POSTGRES_DB: project
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - project_write_db_data:/var/lib/postgresql

  project_read_db:
    image: postgres:18
    environment:
      POSTGRES_DB: project
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - project_read_db_data:/var/lib/postgresql

  user_service:
    image: devboard-user
    build:
      context: .
      dockerfile: Backend/src/Services/User/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8083
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WriteDatabase: Host=user_write_db;Database=user;Username=devboard;Password=devboard
      ConnectionStrings__ReadDatabase: Host=user_read_db;Database=user;Username=devboard;Password=devboard
    ports:
      - "8083:8083"
    depends_on:
      user_write_db:
        condition: service_started
      user_read_db:
        condition: service_started

  user_write_db:
    image: postgres:18
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - user_write_db_data:/var/lib/postgresql

  user_read_db:
    image: postgres:18
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - user_read_db_data:/var/lib/postgresql

  task_service:
    image: devboard-task
    build:
      context: .
      dockerfile: Backend/src/Services/Task/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8082
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__WriteDatabase: Host=task_write_db;Database=task;Username=devboard;Password=devboard
      ConnectionStrings__ReadDatabase: Host=task_read_db;Database=task;Username=devboard;Password=devboard
    ports:
      - "8082:8082"
    depends_on:
      task_write_db:
        condition: service_started
      task_read_db:
        condition: service_started

  task_write_db:
    image: postgres:18
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - task_write_db_data:/var/lib/postgresql
  
  task_read_db:
    image: postgres:18
    environment:
      POSTGRES_DB: task
      POSTGRES_USER: devboard
      POSTGRES_PASSWORD: devboard
    volumes:
      - task_read_db_data:/var/lib/postgresql
  
  rabbitmq:
    image: rabbitmq:latest
    ports:
      - "5672:5672"
      - "15672:15672"
  
volumes:
  project_write_db_data:
  project_read_db_data:
  user_write_db_data:
  user_read_db_data:
  task_write_db_data:
  task_read_db_data: